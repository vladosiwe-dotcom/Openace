name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the mod
        run: ./gradlew build --no-daemon
      - name: Model and animations match their Blockbench source
        run: |
          pip install -q pillow
          python3 tools/blockbench/awakening.py
          git diff --exit-code -- src/main/resources/assets/openace \
            || { echo "::error::regenerate with tools/blockbench/awakening.py"; exit 1; }
      - name: Game tests on a dedicated server
        run: |
          set -o pipefail
          timeout 600 ./gradlew runGameTestServer --no-daemon 2>&1 | tee gametest.log
          grep -E "Openace|failed at|tests passed|tests failed|   - " gametest.log | grep -v "^\s*at " | head -40 || true
          grep -Eq "All [0-9]+ required tests passed" gametest.log || { echo "::error::game tests did not pass"; exit 1; }
      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: openace-jar
          path: build/libs/*.jar
          if-no-files-found: error
