modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

# First-person camera of the scene
[[mixins]]
    config="openace.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# GeckoLib: the animated scene model in the player's skin. Without it the scene plays on the vanilla model.
[[dependencies.${mod_id}]]
    modId="geckolib"
    type="optional"
    versionRange="[4.4,5)"
    ordering="NONE"
    side="CLIENT"
